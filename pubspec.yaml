name: jagoan_inggris
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0

  # Animasi (JSON)
  lottie: ^3.1.0
  
  # Ikon iOS style
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  
  # 3D Viewer (GLB)
  model_viewer_plus: ^1.7.0 
  
  # Font Google
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_tts: ^4.2.5

flutter:
  uses-material-design: true

  # [PENTING] Pendaftaran Aset
  # Gunakan nama folder (diakhiri /) agar semua file di dalamnya terbaca.
  assets:
    - assets/images/          # Untuk icon_body.png, dll (jika ada)
    - assets/models/          # Mendaftarkan SEMUA file .glb (termasuk 8 file avatar, teacher, monster)
    - assets/effects/         # Mendaftarkan SEMUA file .json (fire.json, lightning.json)
    - assets/audio/